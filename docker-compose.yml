services:

  # ----------------------------------------------------------------
  # Polymarket Trading Bot
  # ----------------------------------------------------------------
  trader:
    build: .
    container_name: polymarket-trader
    restart: unless-stopped
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - POLYGON_PRIVATE_KEY=${POLYGON_PRIVATE_KEY}
      - CLOB_API_KEY=${CLOB_API_KEY}
      - CLOB_SECRET=${CLOB_SECRET}
      - CLOB_PASS_PHRASE=${CLOB_PASS_PHRASE}
      - MAX_POSITION_SIZE=${MAX_POSITION_SIZE:-10.0}
      - MAX_PORTFOLIO_RISK=${MAX_PORTFOLIO_RISK:-100.0}
      - MIN_CONFIDENCE_THRESHOLD=${MIN_CONFIDENCE_THRESHOLD:-0.7}
      - MAX_OPEN_POSITIONS=${MAX_OPEN_POSITIONS:-5}
      - TRADING_INTERVAL_MINUTES=${TRADING_INTERVAL_MINUTES:-15}
      - CLOB_API_URL=${CLOB_API_URL:-https://clob.polymarket.com}
      - GAMMA_API_URL=${GAMMA_API_URL:-https://gamma-api.polymarket.com}
      - DRY_RUN=${DRY_RUN:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
